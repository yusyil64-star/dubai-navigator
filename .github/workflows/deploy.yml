# Veröffentlicht die App automatisch auf GitHub Pages,
# sobald neuer Code auf den Zweig "main" hochgeladen wird.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt auch manuelles Starten auf github.com

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Die App liegt online unter https://<konto>.github.io/dubai-navigator/
          BASE_PATH: /dubai-navigator/
          # Adresse des kleinen Verkehrs-Servers (traffic-proxy); der TomTom-Schlüssel liegt nur dort.
          # Leer = App ohne Live-Verkehr
          VITE_TRAFFIC_PROXY: https://dubai-navigator-traffic.traffic-proxy.workers.dev
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
